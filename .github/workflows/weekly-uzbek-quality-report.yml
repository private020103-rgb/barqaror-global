name: Weekly Uzbek Quality Report

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  evaluate-and-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run benchmark
        run: |
          python eval/uzbek_quality_suite/evaluate.py \
            --predictions-dir eval/uzbek_quality_suite/predictions/example \
            --out eval/uzbek_quality_suite/results/latest_results.json

      - name: Update weekly report
        run: |
          python eval/uzbek_quality_suite/update_weekly_report.py \
            --results eval/uzbek_quality_suite/results/latest_results.json \
            --report eval/weekly_report.md

      - name: Commit report update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add eval/weekly_report.md eval/uzbek_quality_suite/results/latest_results.json
          git diff --cached --quiet || git commit -m "chore: update weekly uzbek quality report"
          git push
